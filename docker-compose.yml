services:
  goofy_chat_v2:
    container_name: goofy_chat_v2
    build: .
    volumes:
      - "/etc/letsencrypt:/etc/letsencrypt"
      - "/home/pub/app-data/goofy-chat-v2/data:/srv/server/data"
    networks:
      - "nginx-router_default"
      - "default"
    restart: always

volumes:
  data:
networks:
  default:
  nginx-router_default:
    external: true